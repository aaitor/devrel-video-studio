<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- example-walkthrough — filled from templates/composition.html + brands/acme/tokens.json.
         Timing: title 0→3.05 · footage 3.0 (dur 17.37) · chapters 3.0+beat · CTA 20.2 · total 22.8. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        /* from brands/acme/tokens.json */
        --brand: #4f46e5;
        --brand-deep: #0b1020;
        --accent: #6366f1;
        --highlight: #22d3ee;
        --muted: #94a3b8;
        --line: #e3e7f0;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--brand-deep); }
      body { font-family: "Inter", system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
      .fill { position: absolute; inset: 0; }
      .center { display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; }
      .bg { background: radial-gradient(1200px 720px at 50% 30%, var(--brand) 0%, var(--brand-deep) 72%); }
      .wordmark { color: #fff; display: block; }

      .kicker { font-size: 24px; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; color: var(--highlight); margin: 30px 0 22px; }
      .t-title { font-size: 96px; font-weight: 800; line-height: 1.03; letter-spacing: -.02em; max-width: 1350px; }
      .t-title .hl { color: var(--highlight); }
      .t-sub { font-size: 38px; font-weight: 400; color: var(--muted); margin-top: 30px; }

      #frame { position: absolute; left: 240px; top: 115px; width: 1440px; height: 850px; background: #fff; border-radius: 16px; box-shadow: 0 40px 120px rgba(0,0,0,.5); z-index: 2; }
      .bar { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #f1f3f8; border-radius: 16px 16px 0 0; border-bottom: 1px solid var(--line); }
      .dot { width: 11px; height: 11px; border-radius: 50%; }
      .url { margin-left: 14px; font-size: 15px; color: #5b647c; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 4px 14px; font-weight: 500; }
      #a-roll { position: absolute; left: 240px; top: 155px; width: 1440px; height: 810px; object-fit: cover; background: #fff; border-radius: 0 0 16px 16px; z-index: 3; }

      .chapter { position: absolute; left: 240px; top: 995px; height: 50px; display: flex; align-items: center; gap: 14px; padding: 0 26px; background: rgba(11,16,32,.9); border: 1px solid rgba(99,102,241,.5); border-radius: 999px; font-size: 27px; font-weight: 600; z-index: 6; }
      .chapter .d { width: 11px; height: 11px; border-radius: 50%; background: var(--highlight); }
      #brandmark { position: absolute; right: 244px; top: 1008px; z-index: 6; opacity: .9; }

      .cta-title { font-size: 88px; font-weight: 800; letter-spacing: -.02em; }
      .cta-url { margin-top: 26px; font-size: 40px; font-weight: 600; color: var(--highlight); }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="brand-logo" viewBox="0 0 132 24" fill="currentColor">
        <path d="M0 2h7v2.2H2.2v15.6H7V22H0zM132 2h-7v2.2h4.8v15.6H125V22h7z"/>
        <text x="16" y="18.5" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="800" letter-spacing="1.5">ACME</text>
      </symbol>
    </svg>

    <div id="root" data-composition-id="main" data-start="0" data-duration="25.47" data-width="1920" data-height="1080">

      <div id="bg" class="clip fill bg" data-start="0" data-duration="25.47" data-track-index="0" style="z-index:0"></div>

      <!-- Scene 1 — title -->
      <div id="title" class="clip fill center bg" data-start="0" data-duration="3.82" data-track-index="1" style="z-index:5">
        <svg class="wordmark" viewBox="0 0 132 24" width="220" height="40" style="margin-bottom:10px"><use href="#brand-logo" /></svg>
        <div class="kicker">Product walkthrough</div>
        <div class="t-title">Everything your team ships, <span class="hl">in one place.</span></div>
        <div class="t-sub">Browse, filter, and open — in seconds.</div>
      </div>

      <!-- Scene 2 — framed product footage -->
      <div id="frame" class="clip" data-start="3.82" data-duration="17.37" data-track-index="1">
        <div class="bar">
          <span class="dot" style="background:#ff5f57"></span>
          <span class="dot" style="background:#febc2e"></span>
          <span class="dot" style="background:#28c840"></span>
          <span class="url">acme.com</span>
        </div>
      </div>
      <video id="a-roll" class="clip" src="capture.mp4" muted playsinline data-start="3.82" data-duration="17.37" data-track-index="0"></video>
      <svg id="brandmark" class="clip wordmark" viewBox="0 0 132 24" width="132" height="24" data-start="3.82" data-duration="17.37" data-track-index="2"><use href="#brand-logo" /></svg>

      <!-- chapter lower-thirds — data-start = 3.0 + capture-beat time -->
      <div id="ch1" class="clip chapter" data-start="4.12" data-duration="7.5" data-track-index="3"><span class="d"></span> Your workspace</div>
      <div id="ch2" class="clip chapter" data-start="11.82" data-duration="6.1" data-track-index="3"><span class="d"></span> Filter by category</div>
      <div id="ch3" class="clip chapter" data-start="18.12" data-duration="3.07" data-track-index="3"><span class="d"></span> Open a project</div>

      <!-- Audio — ducked music bed + narration pre-mixed (scripts/variant.sh → narration-mix.mp3) -->
      <audio id="bgm" class="clip" src="narration-mix.mp3" data-start="0" data-duration="25.47" data-track-index="9" data-volume="1"></audio>

      <!-- Scene 3 — CTA -->
      <div id="cta" class="clip fill center bg" data-start="21.19" data-duration="4.28" data-track-index="4" style="z-index:8">
        <svg class="wordmark" viewBox="0 0 132 24" width="220" height="40" style="margin-bottom:34px"><use href="#brand-logo" /></svg>
        <div class="cta-title">Make your own</div>
        <div class="cta-url">github.com/aaitor/devrel-video-studio</div>
      </div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#title .wordmark", { opacity: 0, scale: 0.92, duration: 0.6 }, 0.0);
      tl.from("#title .kicker",   { opacity: 0, y: -18, duration: 0.6 }, 0.25);
      tl.from("#title .t-title",  { opacity: 0, y: 34, duration: 0.7 }, 0.45);
      tl.from("#title .t-sub",    { opacity: 0, y: 20, duration: 0.6 }, 0.8);
      tl.from("#frame",  { opacity: 0, scale: 0.95, duration: 0.6 }, 3.82);
      tl.from("#a-roll", { opacity: 0, scale: 0.95, duration: 0.6 }, 3.82);
      tl.from("#brandmark", { opacity: 0, duration: 0.5 }, 4.12);
      tl.from("#ch1", { opacity: 0, x: -26, duration: 0.5 }, 4.22);
      tl.from("#ch2", { opacity: 0, x: -26, duration: 0.5 }, 11.92);
      tl.from("#ch3", { opacity: 0, x: -26, duration: 0.5 }, 18.22);
      tl.from("#cta .wordmark",  { opacity: 0, y: 22, duration: 0.5 }, 21.29);
      tl.from("#cta .cta-title", { opacity: 0, y: 28, duration: 0.6 }, 21.42);
      tl.from("#cta .cta-url",   { opacity: 0, y: 20, duration: 0.6 }, 21.67);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
