<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1600, initial-scale=1" />
  <title>Acme Corp. — Workspace</title>
  <!-- Self-contained mock "Acme" product. It IS the demo subject the /devrel-video pipeline records,
       so the example has no third-party dependency and stays reproducible forever. No build, no data calls. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand:#4f46e5; --brand-deep:#0b1020; --accent:#6366f1; --highlight:#0891b2;
      --ink:#0b1020; --muted:#5b647c; --line:#e6e8f0; --ground:#ffffff; --surface:#f7f8fc;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:"Inter",system-ui,sans-serif; color:var(--ink); background:var(--surface); -webkit-font-smoothing:antialiased; }
    a { color:inherit; text-decoration:none; }

    header { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:28px;
      padding:0 40px; height:64px; background:rgba(255,255,255,.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px; letter-spacing:-.01em; }
    .brand .mark { width:26px; height:26px; border-radius:7px; background:linear-gradient(135deg,var(--brand),var(--accent)); }
    nav { display:flex; gap:26px; color:var(--muted); font-weight:500; font-size:15px; }
    nav a.active { color:var(--ink); font-weight:600; }
    header .cta { margin-left:auto; background:var(--brand); color:#fff; font-weight:600; font-size:14px; padding:9px 18px; border-radius:9px; }

    .hero { padding:56px 40px 30px; max-width:1200px; }
    .kicker { color:var(--highlight); font-weight:700; letter-spacing:.14em; text-transform:uppercase; font-size:12.5px; }
    .hero h1 { font-size:46px; font-weight:800; letter-spacing:-.025em; margin:12px 0 10px; max-width:760px; line-height:1.05; }
    .hero p { color:var(--muted); font-size:19px; max-width:620px; }

    .tags { display:flex; flex-wrap:wrap; gap:10px; padding:4px 40px 22px; }
    .tags button { font:inherit; font-size:14px; font-weight:600; color:var(--muted); background:var(--ground);
      border:1px solid var(--line); border-radius:999px; padding:8px 16px; cursor:pointer; transition:.18s; }
    .tags button:hover { color:var(--ink); }
    .tags button.active { color:#fff; background:var(--brand); border-color:var(--brand); }

    main { padding:4px 40px 80px; }
    h2.section { font-size:15px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin:8px 0 18px; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:22px; max-width:1240px; }
    .card { text-align:left; font:inherit; color:inherit; cursor:pointer; background:var(--ground); border:1px solid var(--line);
      border-radius:16px; padding:22px; transition:transform .18s, box-shadow .18s, opacity .25s; }
    .card:hover { transform:translateY(-3px); box-shadow:0 18px 40px -22px rgba(11,16,32,.45); }
    .card.hide { display:none; }
    .card .pill { display:inline-block; font-size:11.5px; font-weight:700; color:var(--highlight);
      background:#e0f4f8; border-radius:6px; padding:3px 9px; text-transform:uppercase; letter-spacing:.04em; }
    .card h3 { font-size:21px; font-weight:700; margin:14px 0 8px; letter-spacing:-.01em; }
    .card p { color:var(--muted); font-size:15px; line-height:1.5; }
    .card .meta { margin-top:18px; display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--muted); }
    .card .meta b { color:var(--ink); font-weight:700; }

    /* detail view (in-page) */
    .detail { position:fixed; inset:0; z-index:40; background:var(--surface); overflow:auto; opacity:0; visibility:hidden;
      transition:opacity .28s; }
    .detail.open { opacity:1; visibility:visible; }
    .detail .inner { max-width:900px; margin:0 auto; padding:48px 40px 90px; }
    .detail .back { color:var(--brand); font-weight:600; font-size:15px; cursor:pointer; background:none; border:0; font-family:inherit; }
    .detail h1 { font-size:40px; font-weight:800; letter-spacing:-.02em; margin:22px 0 10px; }
    .detail .sub { color:var(--muted); font-size:19px; margin-bottom:28px; }
    .detail .body { font-size:17px; line-height:1.7; color:#23283a; }
    .detail .body p { margin-bottom:18px; }
    .detail .stat { display:flex; gap:40px; margin:28px 0; }
    .detail .stat div b { display:block; font-size:30px; font-weight:800; }
    .detail .stat div span { color:var(--muted); font-size:14px; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="mark"></span> Acme Corp.</div>
    <nav><a class="active">Workspace</a><a>Catalog</a><a>Reports</a><a>Settings</a></nav>
    <a class="cta">New project</a>
  </header>

  <section class="hero">
    <div class="kicker">Acme Workspace</div>
    <h1>Everything your team ships, in one place.</h1>
    <p>Browse your projects, filter by what you need, and open any one for the full picture — fast.</p>
  </section>

  <div class="tags" id="tags">
    <button data-tag="all" class="active">All</button>
    <button data-tag="analytics">Analytics</button>
    <button data-tag="automation">Automation</button>
    <button data-tag="forecast">Forecast</button>
    <button data-tag="reporting">Reporting</button>
  </div>

  <main>
    <h2 class="section">Your projects</h2>
    <div class="grid" id="grid"></div>
  </main>

  <div class="detail" id="detail"><div class="inner">
    <button class="back" id="back">← Back to workspace</button>
    <h1 id="d-title"></h1>
    <div class="sub" id="d-sub"></div>
    <div class="stat">
      <div><b id="d-s1"></b><span>Runs this month</span></div>
      <div><b id="d-s2"></b><span>Avg. latency</span></div>
      <div><b id="d-s3"></b><span>Success rate</span></div>
    </div>
    <div class="body" id="d-body"></div>
  </div></div>

  <script>
    const ITEMS = [
      { id:"forecast", tag:"forecast",   pill:"Forecast",   title:"Weather Oracle", desc:"A pay-per-call forecast service your agents can query on demand.", by:"Platform team", s:["12.4k","180ms","99.9%"] },
      { id:"pipeline", tag:"automation", pill:"Automation", title:"Release Pipeline", desc:"Ship to staging and production with one reviewed, auditable flow.", by:"DevEx", s:["3.1k","1.2s","99.4%"] },
      { id:"insights", tag:"analytics",  pill:"Analytics",  title:"Usage Insights", desc:"Live dashboards for adoption, retention, and spend across teams.", by:"Data", s:["46k","90ms","100%"] },
      { id:"digest",   tag:"reporting",  pill:"Reporting",  title:"Weekly Digest", desc:"An automated summary of what changed, delivered every Monday.", by:"Ops", s:["980","640ms","99.8%"] },
      { id:"guard",    tag:"automation", pill:"Automation", title:"Policy Guard", desc:"Enforce review rules and spend caps before anything merges.", by:"Security", s:["7.7k","210ms","99.6%"] },
      { id:"atlas",    tag:"analytics",  pill:"Analytics",  title:"Cost Atlas", desc:"Attribute every request to a team, a plan, and a line item.", by:"Finance", s:["22k","110ms","99.9%"] },
    ];
    const grid = document.getElementById('grid');
    grid.innerHTML = ITEMS.map(i =>
      `<button class="card" data-item="${i.id}" data-tag="${i.tag}">
         <span class="pill">${i.pill}</span>
         <h3>${i.title}</h3><p>${i.desc}</p>
         <div class="meta">by <b>${i.by}</b> · <b>${i.s[0]}</b> runs</div>
       </button>`).join('');

    // Beat 2 — tag filter (in place)
    document.getElementById('tags').addEventListener('click', e => {
      const b = e.target.closest('button[data-tag]'); if (!b) return;
      document.querySelectorAll('#tags button').forEach(x => x.classList.toggle('active', x === b));
      const t = b.dataset.tag;
      document.querySelectorAll('.card').forEach(c => c.classList.toggle('hide', t !== 'all' && c.dataset.tag !== t));
    });

    // Beat 3 — open an item
    const $ = id => document.getElementById(id);
    const detail = $('detail');
    grid.addEventListener('click', e => {
      const c = e.target.closest('.card[data-item]'); if (!c) return;
      const i = ITEMS.find(x => x.id === c.dataset.item);
      $('d-title').textContent = i.title; $('d-sub').textContent = i.pill + " · by " + i.by;
      $('d-s1').textContent = i.s[0]; $('d-s2').textContent = i.s[1]; $('d-s3').textContent = i.s[2];
      $('d-body').innerHTML = `<p>${i.desc}</p>
        <p>Open any project to see how it is called, what it costs per request, and how it is performing — all from one view, with no context switch.</p>
        <p>Share it with a teammate, wire it into a workflow, or promote it to production when the numbers look right.</p>`;
      detail.classList.add('open'); detail.scrollTop = 0;
    });
    document.getElementById('back').addEventListener('click', () => detail.classList.remove('open'));
  </script>
</body>
</html>
