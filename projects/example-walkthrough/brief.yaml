# devrel-video project manifest — a worked example. Silent, browser-only tour of a public demo app.
id: example-walkthrough
mode: silent-demo
audience: developers evaluating a product
message: "You can browse, filter, and open content in seconds"
cta:
  title: "Make your own"
  url: "github.com/aaitor/devrel-video-studio"
duration_target_seconds: 24
brand: acme                   # brands/acme/ — the default placeholder brand (swap for a real one)

capture:
  url: "http://localhost:8000/"       # the self-contained Acme mock app in ./site/ (no login, no PII, no external deps)
  start_command: "python3 -m http.server 8000 --directory projects/example-walkthrough/site"
  viewport: "1600x900"
  url_label: "acme.com"               # the frame shows the product's canonical domain (it IS the Acme app)

environments: []              # pure-browser (the default). Multi-env (terminal ⇄ browser) is optional — SKILL §5.8.
terminal:
  demo_dir: null

# chapter data-start = 3.0 (title) + at_seconds. Re-sync at_seconds to your capture.js pacing after recording.
beats:
  - label: "Your workspace"
    at_seconds: 0.3
  - label: "Filter by category"
    at_seconds: 7.8
  - label: "Open a project"
    at_seconds: 12.6

approved_claims:              # only on-page / verifiable text may appear on screen — never invented
  - "Everything your team ships, in one place."

outputs:
  - profile: docs-16x9        # 1920x1080, silent

# Optional layers are off for this example (narration/avatar need a TTS endpoint / GPU host — see scripts/_env.sh).
audio:
  music: null
  narration: null
  avatar: null
  avatar_plate: null
  subtitles: []
