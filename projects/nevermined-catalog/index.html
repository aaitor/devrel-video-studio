<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- ponytail: GSAP + Inter load from CDN for this draft. For a confidential/production render, VENDOR both locally (guide §5.5/§14.5). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --teal: #0d3f48; --teal-dark: #082826; --mint: #12968c;
        --lime: #d7f771; --lime-ink: #3f5410; --ink: #0a0a0a;
        --muted: #9fb7b0; --line: #e3e7f0;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--teal-dark); }
      body { font-family: "Inter", system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
      .fill { position: absolute; inset: 0; }
      .center { display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; }
      .bg { background: radial-gradient(1200px 720px at 50% 30%, #0d3f48 0%, #082826 72%); }
      .wordmark { color: #fff; display: block; }
      .lime { color: var(--lime); }

      /* Title scene */
      .kicker { font-size: 24px; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; color: var(--lime); margin: 30px 0 22px; }
      .t-title { font-size: 96px; font-weight: 800; line-height: 1.03; letter-spacing: -.02em; max-width: 1350px; }
      .t-title .hl { color: var(--lime); }
      .t-sub { font-size: 38px; font-weight: 400; color: var(--muted); margin-top: 30px; }

      /* Footage frame */
      #frame { position: absolute; left: 240px; top: 115px; width: 1440px; height: 850px;
               background: #fff; border-radius: 16px; box-shadow: 0 40px 120px rgba(0,0,0,.5); z-index: 2; }
      .bar { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 16px;
             background: #f1f3f8; border-radius: 16px 16px 0 0; border-bottom: 1px solid var(--line); }
      .dot { width: 11px; height: 11px; border-radius: 50%; }
      .url { margin-left: 14px; font-size: 15px; color: #5b647c; background: #fff; border: 1px solid var(--line);
             border-radius: 8px; padding: 4px 14px; font-weight: 500; }
      #a-roll { position: absolute; left: 240px; top: 155px; width: 1440px; height: 810px;
                object-fit: cover; background: #fff; border-radius: 0 0 16px 16px; z-index: 3; }

      /* bottom band: chapter + brandmark */
      .chapter { position: absolute; left: 240px; top: 995px; height: 50px; display: flex; align-items: center; gap: 14px;
                 padding: 0 26px; background: rgba(8,40,38,.9); border: 1px solid rgba(18,150,140,.55);
                 border-radius: 999px; font-size: 27px; font-weight: 600; z-index: 6; }
      .chapter .d { width: 11px; height: 11px; border-radius: 50%; background: var(--lime); }
      #brandmark { position: absolute; right: 244px; top: 1008px; z-index: 6; opacity: .9; }

      /* CTA scene */
      .cta-title { font-size: 88px; font-weight: 800; letter-spacing: -.02em; }
      .cta-url { margin-top: 26px; font-size: 40px; font-weight: 600; color: var(--lime); }
    </style>
  </head>
  <body>

      </symbol>
    </svg>

    <div id="root" data-composition-id="main" data-start="0" data-duration="25.7" data-width="1920" data-height="1080">

      <!-- background -->
      <div id="bg" class="clip fill bg" data-start="0" data-duration="25.7" data-track-index="0" style="z-index:0"></div>

      <!-- music bed (local synth placeholder; swap via /media-use bgm through this same seam) -->
      <audio id="bgm" class="clip" src="bgm.mp3" data-start="0" data-duration="25.7" data-track-index="9" data-volume="0.85"></audio>

      <!-- Scene 1: title -->
      <div id="title" class="clip fill center bg" data-start="0" data-duration="3.05" data-track-index="1" style="z-index:5">
        <svg class="wordmark" width="300" height="35" style="margin-bottom:10px"><use href="#nvm-logo" /></svg>
        <div class="kicker">AI Services Catalog · Curated by Nevermined</div>
        <div class="t-title">The public catalog of<br /><span class="hl">pay-per-call</span> AI Services.</div>
        <div class="t-sub">149 curated services · one API key · no checkout.</div>
      </div>

      <!-- Scene 2: framed product footage -->
      <div id="frame" class="clip" data-start="3.0" data-duration="20.32" data-track-index="1">
        <div class="bar">
          <span class="dot" style="background:#ff5f57"></span>
          <span class="dot" style="background:#febc2e"></span>
          <span class="dot" style="background:#28c840"></span>
          <span class="url">nevermined.app/catalog</span>
        </div>
      </div>
      <video id="a-roll" class="clip" src="capture.mp4" muted playsinline
             data-start="3.0" data-duration="20.32" data-track-index="0"></video>

      <!-- brandmark (bottom-right) during footage -->
      <svg id="brandmark" class="clip wordmark" width="176" height="21" data-start="3.0" data-duration="20.32" data-track-index="2"><use href="#nvm-logo" /></svg>

      <!-- chapter lower-thirds (synced to capture beats, +3.0s offset) -->
      <div id="ch1" class="clip chapter" data-start="3.3" data-duration="6.9" data-track-index="3"><span class="d"></span> Browse 149 AI Services</div>
      <div id="ch2" class="clip chapter" data-start="10.5" data-duration="6.0" data-track-index="3"><span class="d"></span> Filter by category</div>
      <div id="ch3" class="clip chapter" data-start="16.8" data-duration="6.4" data-track-index="3"><span class="d"></span> Inspect a service</div>

      <!-- Scene 3: CTA -->
      <div id="cta" class="clip fill center bg" data-start="23.1" data-duration="2.6" data-track-index="4" style="z-index:8">
        <svg class="wordmark" width="300" height="35" style="margin-bottom:34px"><use href="#nvm-logo" /></svg>
        <div class="cta-title">Explore the catalog</div>
        <div class="cta-url">nevermined.app/catalog</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // title
      tl.from("#title .wordmark", { opacity: 0, scale: 0.92, duration: 0.6 }, 0.0);
      tl.from("#title .kicker", { opacity: 0, y: -18, duration: 0.6 }, 0.25);
      tl.from("#title .t-title", { opacity: 0, y: 34, duration: 0.7 }, 0.45);
      tl.from("#title .t-sub", { opacity: 0, y: 20, duration: 0.6 }, 0.8);
      // footage
      tl.from("#frame", { opacity: 0, scale: 0.95, duration: 0.6 }, 3.0);
      tl.from("#a-roll", { opacity: 0, scale: 0.95, duration: 0.6 }, 3.0);
      tl.from("#brandmark", { opacity: 0, duration: 0.5 }, 3.3);
      // chapters
      tl.from("#ch1", { opacity: 0, x: -26, duration: 0.5 }, 3.4);
      tl.from("#ch2", { opacity: 0, x: -26, duration: 0.5 }, 10.6);
      tl.from("#ch3", { opacity: 0, x: -26, duration: 0.5 }, 16.9);
      // cta
      tl.from("#cta .wordmark", { opacity: 0, y: 22, duration: 0.5 }, 23.2);
      tl.from("#cta .cta-title", { opacity: 0, y: 28, duration: 0.6 }, 23.35);
      tl.from("#cta .cta-url", { opacity: 0, y: 20, duration: 0.6 }, 23.6);
      window.__timelines["main"] = tl;
    </script>

</html>
