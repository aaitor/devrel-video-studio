id: nevermined-catalog
mode: silent-demo
audience: developers evaluating the Nevermined AI Services catalog
message: "A public catalog of pay-per-call AI Services — browse, filter, and call any of them with one API key"
cta:
  title: "Explore the catalog"
  url: "nevermined.app/catalog"
duration_target_seconds: 26
brand: nevermined

capture:
  url: "https://nevermined.app/catalog"
  start_command: null
  viewport: "1600x900"
  url_label: "nevermined.app/catalog"

beats:
  - label: "Browse 149 AI Services"
    at_seconds: 0.3
  - label: "Filter by category"
    at_seconds: 7.5
  - label: "Inspect a service"
    at_seconds: 13.8

approved_claims:
  - "149 curated services"
  - "one API key"
  - "no checkout"
  - "pay-per-call"

outputs:
  - profile: docs-16x9

audio:
  music: bgm.mp3   # local synth bed via scripts/gen-bgm.py
  narration: leo   # Orpheus MALE voice (matches the male presenter); composition re-timed to the voice (leo is snappier -> 27.2s). Male voices: leo/dan/zac; female: tara/leah/jess/mia/zoe.
  avatar: [intro, cta]   # face-only circular bubbles (scripts/avatar.sh → LatentSync on Melkor), face-tracked + lip-synced to the intro & CTA lines
  avatar_plate: ~/Videos/Nevermined/DevRel/Talking_Head/Aitor/shorter_but_better.mp4   # PRIVATE talking-head recording, kept OUTSIDE the (public) repo; avatar.sh reads it. Generated bubbles (avatar-*.mp4) are gitignored — never committed.
  subtitles: [en, es]   # captions.en.srt, captions.es.srt
