# devrel-video project manifest — Acme Workspace walkthrough (planning only; not yet captured/rendered).
id: demo
mode: silent-demo             # silent-demo | narrated-devrel (roadmap) | promo (roadmap)
audience: developers evaluating Acme Workspace
message: "Everything your team ships, in one place."
cta:
  title: "Make your own"
  url: "github.com/aaitor/devrel-video-studio"
duration_target_seconds: 25
brand: acme                   # brands/acme/ (tokens.json + logo.svg)

capture:
  url: "http://localhost:8000/"
  start_command: "python3 -m http.server 8000 --directory projects/example-walkthrough/site"
  viewport: "1600x900"
  url_label: "localhost:8000"   # shown in the browser-frame address bar

# Pure-browser video (the default) — no terminal/browser scene switching.
environments: []
terminal:
  demo_dir: null

# Each beat becomes a chapter lower-third. chapter data-start = 3.0 (title) + at_seconds.
# ~3s title card + ~22s footage across three beats = ~25s target.
beats:
  - label: "Your workspace"
    at_seconds: 0.5
  - label: "Filter by category"
    at_seconds: 8.0
  - label: "Open a project"
    at_seconds: 15.0

# Only these may appear on screen — all read from the fixture page, none invented.
approved_claims:
  - "Everything your team ships, in one place."
  - "Acme Workspace"
  - "Weather Oracle"
  - "Forecast"
  - "12.4k runs this month"
  - "180ms avg. latency"
  - "99.9% success rate"

outputs:
  - profile: docs-16x9        # 1920x1080, silent

# ── Optional layers — all off for this silent cut ──
audio:
  music: null
  narration: null
  avatar: null
  avatar_plate: null
  subtitles: []
