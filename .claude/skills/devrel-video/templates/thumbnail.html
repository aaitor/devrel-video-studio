<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <!-- TEMPLATE — YouTube thumbnail (1280×720). Copy to projects/<slug>/thumbnail.html, fill {{...}} from
         brief + brands/<name>/tokens.json, then `scripts/thumbnail.sh projects/<slug>` → renders/thumbnail.jpg.
         The hero shot (renders/hero.png) is extracted from capture.mp4 by that script. ponytail: fonts from CDN. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family={{FONT}}:wght@400;600;700;800&display=block" rel="stylesheet" />
    <style>
      :root { --brand: {{BRAND}}; --brand-deep: {{BRAND_DEEP}}; --highlight: {{HIGHLIGHT}}; --muted:#94a3b8; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1280px; height:720px; overflow:hidden; }
      body { font-family:"{{FONT}}", system-ui, sans-serif; color:#fff;
        background: radial-gradient(900px 560px at 26% 32%, var(--brand) 0%, var(--brand-deep) 70%); -webkit-font-smoothing:antialiased; }
      .wrap { position:absolute; inset:0; display:flex; align-items:center; gap:46px; padding:0 72px; }
      .left { width:560px; flex:none; }
      .wordmark { height:34px; color:#fff; display:block; margin-bottom:26px; }
      .kicker { font-size:21px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--highlight); margin-bottom:18px; }
      h1 { font-size:66px; font-weight:800; line-height:1.02; letter-spacing:-.02em; }
      h1 .hl { color:var(--highlight); }
      .sub { font-size:25px; color:var(--muted); margin-top:22px; font-weight:500; }

      .hero { position:relative; flex:1; height:470px; border-radius:16px; overflow:hidden;
        box-shadow:0 50px 120px rgba(0,0,0,.55); transform:perspective(1600px) rotateY(-9deg) rotateX(2deg) scale(1.02);
        background:#fff; border:1px solid rgba(255,255,255,.12); }
      .hero .bar { height:34px; display:flex; align-items:center; gap:7px; padding:0 14px; background:#f1f3f8; border-bottom:1px solid #e3e7f0; }
      .hero .dot { width:10px; height:10px; border-radius:50%; }
      .hero .url { margin-left:12px; font-size:13px; color:#5b647c; background:#fff; border:1px solid #e3e7f0; border-radius:7px; padding:3px 12px; font-weight:500; }
      .hero img { display:block; width:100%; height:calc(100% - 34px); object-fit:cover; object-position:top left; }
      .play { position:absolute; left:50%; top:calc(50% + 17px); transform:translate(-50%,-50%);
        width:96px; height:96px; border-radius:50%; background:var(--highlight); display:flex; align-items:center; justify-content:center;
        box-shadow:0 14px 44px rgba(0,0,0,.5); }
      .play::after { content:""; border-left:30px solid var(--brand-deep); border-top:19px solid transparent; border-bottom:19px solid transparent; margin-left:7px; }
    </style>
  </head>
  <body>
    {{LOGO_SYMBOL}}
    <div class="wrap">
      <div class="left">
        <svg class="wordmark" viewBox="0 0 132 24" width="187"><use href="#brand-logo" /></svg>
        <div class="kicker">{{KICKER}}</div>
        <h1>{{HEADLINE_HTML}}</h1>
        <div class="sub">{{SUB}}</div>
      </div>
      <div class="hero">
        <div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span class="url">{{URL_LABEL}}</span></div>
        <img src="renders/hero.png" alt="" />
        <div class="play"></div>
      </div>
    </div>
  </body>
</html>
